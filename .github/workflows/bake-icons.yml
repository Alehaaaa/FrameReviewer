name: Bake PNG icons

on:
  push:
    branches:
      - feature/review-open-playblast-png
    paths:
      - 'icons/*.svg'
      - 'tools/bake_icons.py'
      - '.github/workflows/bake-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cairosvg
      - run: python tools/bake_icons.py
      - name: Commit raster assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Bake PNG icon assets alongside SVG originals"
            git push
          fi
