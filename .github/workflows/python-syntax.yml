name: Python syntax

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install FFmpeg for real-media verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Media process regression tests
        run: python -m unittest discover -s tests -v

  qt-playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install standalone Qt
        run: python -m pip install PySide6==6.8.3
      - name: Offscreen playlist selection and delete
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p 'test_qt_playlist.py' -v
